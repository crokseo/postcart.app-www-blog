name: Deploy blog to postcart.app

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 */2 * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy /blog via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./dist/blog/.
          target: ~/postcart.app_www/blog/
          strip_components: 0

      - name: Deploy /category via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./dist/category/.
          target: ~/postcart.app_www/category/
          strip_components: 0

      - name: Deploy /css via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./dist/css/.
          target: ~/postcart.app_www/css/
          strip_components: 0

      - name: Deploy sitemap via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./dist/sitemap*.xml
          target: ~/postcart.app_www/
          strip_components: 2

      - name: Fix permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            find ~/postcart.app_www/blog/ -type d -exec chmod 755 {} \;
            find ~/postcart.app_www/blog/ -type f -exec chmod 644 {} \;
            find ~/postcart.app_www/category/ -type d -exec chmod 755 {} \;
            find ~/postcart.app_www/category/ -type f -exec chmod 644 {} \;
            find ~/postcart.app_www/css/ -type d -exec chmod 755 {} \;
            find ~/postcart.app_www/css/ -type f -exec chmod 644 {} \;
            chmod 644 ~/postcart.app_www/sitemap*.xml 2>/dev/null || true
