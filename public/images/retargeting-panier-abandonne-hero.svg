<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1a2e;stop-opacity:1" />
    </linearGradient>
    <!-- Orange accent -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <!-- Violet accent -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <!-- Red warning -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <!-- Pixel glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- Clip for screen -->
    <clipPath id="screenClip">
      <rect x="660" y="60" width="420" height="280" rx="12"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.8" fill="#ffffff" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Ambient glow left -->
  <ellipse cx="200" cy="320" rx="300" ry="250" fill="#7c3aed" opacity="0.06"/>
  <!-- Ambient glow right -->
  <ellipse cx="980" cy="200" rx="260" ry="200" fill="#f59e0b" opacity="0.06"/>

  <!-- ── PIXEL / TARGETING VISUAL — Right side ── -->

  <!-- Monitor screen frame -->
  <rect x="650" y="45" width="450" height="310" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="660" y="55" width="430" height="290" rx="10" fill="#0f172a"/>

  <!-- Screen content: targeting crosshair -->
  <!-- Horizontal rule -->
  <line x1="660" y1="200" x2="1090" y2="200" stroke="#334155" stroke-width="0.6" stroke-dasharray="4,4"/>
  <!-- Vertical rule -->
  <line x1="875" y1="55" x2="875" y2="345" stroke="#334155" stroke-width="0.6" stroke-dasharray="4,4"/>

  <!-- Outer target ring -->
  <circle cx="875" cy="200" r="115" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.5" stroke-dasharray="8,4"/>
  <!-- Middle ring -->
  <circle cx="875" cy="200" r="75" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <!-- Inner ring -->
  <circle cx="875" cy="200" r="38" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.85" filter="url(#glow)"/>
  <!-- Center dot -->
  <circle cx="875" cy="200" r="8" fill="#f59e0b" filter="url(#strongGlow)"/>

  <!-- Crosshair lines -->
  <line x1="820" y1="200" x2="840" y2="200" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  <line x1="910" y1="200" x2="930" y2="200" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  <line x1="875" y1="145" x2="875" y2="162" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  <line x1="875" y1="238" x2="875" y2="255" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>

  <!-- Scanning dots around ring — simulating pixel tracking -->
  <circle cx="875" cy="85" r="3.5" fill="#7c3aed" opacity="0.9" filter="url(#glow)"/>
  <circle cx="960" cy="128" r="3" fill="#7c3aed" opacity="0.7"/>
  <circle cx="985" cy="200" r="3.5" fill="#f59e0b" opacity="0.8" filter="url(#glow)"/>
  <circle cx="960" cy="272" r="3" fill="#7c3aed" opacity="0.6"/>
  <circle cx="875" cy="315" r="3.5" fill="#7c3aed" opacity="0.9"/>
  <circle cx="790" cy="272" r="3" fill="#ef4444" opacity="0.6"/>
  <circle cx="765" cy="200" r="3.5" fill="#ef4444" opacity="0.7" filter="url(#glow)"/>
  <circle cx="790" cy="128" r="3" fill="#7c3aed" opacity="0.5"/>

  <!-- iOS 14 broken pixel — X mark top-right of screen -->
  <g transform="translate(1030, 80)">
    <circle cx="0" cy="0" r="22" fill="#ef4444" opacity="0.15"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ef4444" stroke-width="2.5" opacity="0.9"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ef4444" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Monitor stand -->
  <rect x="845" y="355" width="60" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="820" y="370" width="110" height="8" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- ── STAT BADGES — right column, below monitor ── -->

  <!-- Badge: Match rate -->
  <rect x="650" y="400" width="200" height="70" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
  <text x="750" y="426" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" fill="#a78bfa" letter-spacing="0.5">MATCH RATE PIXEL</text>
  <text x="750" y="454" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#violetGrad)">50–60 %</text>
  <text x="750" y="468" text-anchor="middle" font-family="'Arial', sans-serif" font-size="9" fill="#64748b">vs 90 %+ avant iOS 14</text>

  <!-- Badge: CPM -->
  <rect x="870" y="400" width="200" height="70" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
  <text x="970" y="426" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" fill="#f87171" letter-spacing="0.5">CPM META</text>
  <text x="970" y="454" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#redGrad)">+89 %</text>
  <text x="970" y="468" text-anchor="middle" font-family="'Arial', sans-serif" font-size="9" fill="#64748b">depuis 2020 · Wordstream 2024</text>

  <!-- ── LEFT SIDE — headline + stats ── -->

  <!-- Tag line -->
  <rect x="50" y="55" width="220" height="28" rx="6" fill="#7c3aed" opacity="0.2"/>
  <rect x="50" y="55" width="220" height="28" rx="6" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>
  <text x="160" y="74" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" fill="#c4b5fd" letter-spacing="1" font-weight="600">RETARGETING PANIER 2026</text>

  <!-- Main headline -->
  <text x="50" y="135" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff">Ce qui</text>
  <text x="50" y="180" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff">fonctionne</text>
  <text x="50" y="225" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="url(#orangeGrad)">encore vraiment</text>

  <!-- Subtitle -->
  <text x="50" y="268" font-family="'Arial', sans-serif" font-size="15" fill="#94a3b8">iOS 14 · Meta · Google Display</text>
  <text x="50" y="290" font-family="'Arial', sans-serif" font-size="15" fill="#94a3b8">Shopify Audiences · attribution ROAS</text>

  <!-- Divider -->
  <line x1="50" y1="315" x2="580" y2="315" stroke="#334155" stroke-width="1"/>

  <!-- ── ROAS COMPARISON — bottom left ── -->

  <!-- Section label -->
  <text x="50" y="345" font-family="'Arial', sans-serif" font-size="11" fill="#64748b" letter-spacing="1">ROAS RETARGETING PANIER EN 2026</text>

  <!-- Bar: Last-click -->
  <rect x="50" y="358" width="520" height="36" rx="6" fill="#1e293b"/>
  <rect x="50" y="358" width="435" height="36" rx="6" fill="url(#orangeGrad)" opacity="0.85"/>
  <text x="62" y="382" font-family="'Arial', sans-serif" font-size="12" fill="#0f172a" font-weight="700">Attribution last-click</text>
  <text x="494" y="382" text-anchor="end" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff">4–12x</text>

  <!-- Bar: Data-driven -->
  <rect x="50" y="402" width="520" height="36" rx="6" fill="#1e293b"/>
  <rect x="50" y="402" width="270" height="36" rx="6" fill="url(#violetGrad)" opacity="0.85"/>
  <text x="62" y="426" font-family="'Arial', sans-serif" font-size="12" fill="#ffffff" font-weight="700">Attribution data-driven</text>
  <text x="338" y="426" text-anchor="end" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff">2–8x</text>

  <!-- Bar: Google Display CVR -->
  <rect x="50" y="446" width="520" height="36" rx="6" fill="#1e293b"/>
  <rect x="50" y="446" width="160" height="36" rx="6" fill="#0f766e" opacity="0.85"/>
  <text x="62" y="470" font-family="'Arial', sans-serif" font-size="12" fill="#ffffff" font-weight="700">Google Display CVR</text>
  <text x="228" y="470" text-anchor="end" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff">0,5–2 %</text>

  <!-- ── iOS 14 IMPACT pill ── -->
  <rect x="50" y="498" width="340" height="50" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" opacity="0.9"/>
  <!-- iOS icon area -->
  <rect x="62" y="510" width="28" height="28" rx="6" fill="#ef4444" opacity="0.9"/>
  <text x="76" y="530" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff" font-weight="900">i</text>
  <text x="105" y="520" font-family="'Arial', sans-serif" font-size="10" fill="#f87171" letter-spacing="0.5">iOS 14 IMPACT</text>
  <text x="105" y="537" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff">-30 à -50 % de couverture pixel</text>

  <!-- ── BRANDING — bottom left ── -->
  <text x="50" y="605" font-family="'Arial', sans-serif" font-size="13" fill="#475569">postcart</text>
  <text x="107" y="605" font-family="'Arial', sans-serif" font-size="13" fill="#f59e0b" font-weight="700">.app</text>
  <text x="148" y="605" font-family="'Arial', sans-serif" font-size="11" fill="#334155"> — relance panier sans pixel, sans cookie</text>

  <!-- Accent line bottom -->
  <rect x="0" y="618" width="1200" height="3" fill="url(#orangeGrad)" opacity="0.7"/>

</svg>
