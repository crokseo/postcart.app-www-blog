<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2035;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f87171;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="connectorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.6" />
      <stop offset="60%" style="stop-color:#10b981;stop-opacity:0.4" />
      <stop offset="80%" style="stop-color:#f59e0b;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.5" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowCard">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Dot pattern -->
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="1" fill="#ffffff" opacity="0.03"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative glow blobs -->
  <circle cx="100" cy="520" r="180" fill="#10b981" opacity="0.04"/>
  <circle cx="1050" cy="120" r="160" fill="#ef4444" opacity="0.05"/>
  <circle cx="600" cy="580" r="120" fill="#6c63ff" opacity="0.04"/>

  <!-- ── HEADER ── -->
  <text x="72" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6c63ff" letter-spacing="4">FRÉQUENCE &amp; SÉQUENCE</text>

  <text x="72" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="-1">Combien de relances</text>
  <text x="72" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="-1">pour un panier abandonné ?</text>

  <text x="72" y="210" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8">Le nombre optimal de touchpoints selon les données 2024-2026</text>

  <!-- Accent line -->
  <rect x="72" y="230" width="60" height="3" rx="2" fill="url(#violetGrad)"/>

  <!-- ── STAT BADGE "3 emails max" ── -->
  <rect x="72" y="256" width="310" height="88" rx="12" fill="#0d2a1e" stroke="#10b981" stroke-width="1.5" filter="url(#shadowCard)"/>
  <text x="92" y="288" font-family="Arial, sans-serif" font-size="12" fill="#6ee7b7" letter-spacing="2">CONSENSUS 2024</text>
  <text x="92" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#10b981" filter="url(#glowGreen)">3 emails max</text>

  <!-- ── TOUCHPOINT VISUALIZER (right panel) ── -->
  <!-- Container background -->
  <rect x="430" y="48" width="730" height="550" rx="16" fill="#0d1829" stroke="#1e293b" stroke-width="1" filter="url(#shadowCard)"/>

  <!-- Title inside panel -->
  <text x="540" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="3">TOUCHPOINTS DE LA SÉQUENCE</text>

  <!-- Horizontal connector line -->
  <line x1="510" y1="300" x2="1110" y2="300" stroke="url(#connectorGrad)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- ── TOUCHPOINT 1 — Email (GREEN) ── -->
  <g transform="translate(510, 220)">
    <!-- Circle -->
    <circle cx="40" cy="80" r="38" fill="#0d2a1e" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>
    <text x="40" y="86" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">1</text>
    <!-- Badge -->
    <rect x="-8" y="128" width="96" height="22" rx="6" fill="#10b981" opacity="0.15"/>
    <text x="40" y="143" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">EMAIL</text>
    <!-- Delay -->
    <text x="40" y="172" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">H+1 à H+3</text>
    <!-- Open rate -->
    <text x="40" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">45–50%</text>
    <text x="40" y="208" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">d'ouverture</text>
    <!-- Optimal label -->
    <rect x="5" y="220" width="70" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="40" y="232" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">OPTIMAL</text>
  </g>

  <!-- ── TOUCHPOINT 2 — SMS (GREEN) ── -->
  <g transform="translate(630, 220)">
    <circle cx="40" cy="80" r="38" fill="#0d2a1e" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>
    <text x="40" y="86" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">2</text>
    <rect x="-8" y="128" width="96" height="22" rx="6" fill="#10b981" opacity="0.15"/>
    <text x="40" y="143" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">SMS</text>
    <text x="40" y="172" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">H+2 à H+4</text>
    <text x="40" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">~30%</text>
    <text x="40" y="208" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">clic (opt-in)</text>
    <rect x="5" y="220" width="70" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="40" y="232" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">OPTIMAL</text>
  </g>

  <!-- ── TOUCHPOINT 3 — Email (GREEN) ── -->
  <g transform="translate(750, 220)">
    <circle cx="40" cy="80" r="38" fill="#0d2a1e" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>
    <text x="40" y="86" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">3</text>
    <rect x="-8" y="128" width="96" height="22" rx="6" fill="#10b981" opacity="0.15"/>
    <text x="40" y="143" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">EMAIL</text>
    <text x="40" y="172" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">J+2 à J+3</text>
    <text x="40" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">28–35%</text>
    <text x="40" y="208" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">d'ouverture</text>
    <rect x="5" y="220" width="70" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="40" y="232" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">OPTIMAL</text>
  </g>

  <!-- ── TOUCHPOINT 4 — Email (AMBER) ── -->
  <g transform="translate(870, 220)">
    <circle cx="40" cy="80" r="38" fill="#1c1206" stroke="#f59e0b" stroke-width="2"/>
    <text x="40" y="86" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#f59e0b" text-anchor="middle">4</text>
    <rect x="-8" y="128" width="96" height="22" rx="6" fill="#f59e0b" opacity="0.12"/>
    <text x="40" y="143" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="1">EMAIL</text>
    <text x="40" y="172" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">J+5 à J+7</text>
    <text x="40" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">18–22%</text>
    <text x="40" y="208" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">d'ouverture</text>
    <rect x="2" y="220" width="76" height="18" rx="4" fill="#f59e0b" opacity="0.15"/>
    <text x="40" y="232" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">LIMITE</text>
  </g>

  <!-- ── TOUCHPOINT 5 — Carte postale (GREEN - canal indépendant) ── -->
  <g transform="translate(990, 220)">
    <circle cx="40" cy="80" r="38" fill="#0d2a1e" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" filter="url(#glowGreen)"/>
    <text x="40" y="86" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">5</text>
    <rect x="-20" y="128" width="120" height="22" rx="6" fill="#6c63ff" opacity="0.15"/>
    <text x="40" y="143" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">CARTE POSTALE</text>
    <text x="40" y="172" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">J+10 envoi</text>
    <text x="40" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">~70%</text>
    <text x="40" y="208" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">taux lecture</text>
    <rect x="5" y="220" width="70" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="40" y="232" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">OPTIMAL</text>
  </g>

  <!-- ── "EMAIL 6+" zone (RED — zone excessive) ── -->
  <!-- Red zone overlay to the right -->
  <rect x="1100" y="110" width="46" height="400" rx="8" fill="#ef4444" opacity="0.06"/>
  <text x="1123" y="200" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="1" transform="rotate(90, 1123, 200)">ZONE EXCESSIVE →</text>

  <!-- Email 6+ mini indicator -->
  <g transform="translate(1105, 255)">
    <circle cx="20" cy="45" r="20" fill="#2a0d0d" stroke="#ef4444" stroke-width="1.5" filter="url(#glowRed)"/>
    <text x="20" y="51" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">6+</text>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="9" fill="#f87171" text-anchor="middle">&lt;12%</text>
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">ouverture</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#ef4444" text-anchor="middle">+40% spam</text>
  </g>

  <!-- ── LEGEND / KEY STATS bottom area ── -->
  <!-- Green dot legend -->
  <circle cx="456" cy="520" r="6" fill="#10b981"/>
  <text x="470" y="525" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Optimal (ROI positif)</text>

  <!-- Amber dot legend -->
  <circle cx="608" cy="520" r="6" fill="#f59e0b"/>
  <text x="622" y="525" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Limite (surveiller)</text>

  <!-- Red dot legend -->
  <circle cx="756" cy="520" r="6" fill="#ef4444"/>
  <text x="770" y="525" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Excessif (nuisible)</text>

  <!-- Dashed circle = canal physique -->
  <circle cx="920" cy="520" r="6" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="934" y="525" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Canal physique (indépendant)</text>

  <!-- ── LEFT COLUMN BOTTOM — additional stats ── -->
  <!-- Stat 2 -->
  <rect x="72" y="368" width="310" height="72" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="92" y="394" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Intervalle minimum entre emails</text>
  <text x="92" y="424" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#ffffff">24–48 h</text>

  <!-- Stat 3 -->
  <rect x="72" y="456" width="310" height="72" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="92" y="482" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Désabonnement / email supplémentaire</text>
  <text x="92" y="514" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#ef4444">+0,4 %</text>

  <!-- ── BRANDING postcart.app — bottom left ── -->
  <rect x="72" y="546" width="160" height="36" rx="8" fill="#6c63ff" opacity="0.15"/>
  <text x="152" y="568" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">postcart.app</text>
</svg>
