  <text x="696" y="216" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#94a3b8">Délai 24–72h · contenu limité · pas de promo agressive</text>
  <text x="696" y="231" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#94a3b8">Aucune solution self-service Shopify FR en 2026</text>

  <!-- Constraint block 3 : Opt-out et blocage -->
  <g filter="url(#cardShadow)">
    <rect x="636" y="260" width="488" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <circle cx="668" cy="294" r="18" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="668" y="299" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="14" fill="#ef4444">!</text>
  <text x="696" y="282" font-family="'Inter',Arial,sans-serif" font-weight="700" font-size="12" fill="#f1f5f9">Opt-out élevé · risque de suspension</text>
  <text x="696" y="298" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#94a3b8">72% des Français : WhatsApp = espace privé (YouGov 2024)</text>
  <text x="696" y="313" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#ef4444">1 signalement → revue Meta → blocage compte possible</text>

