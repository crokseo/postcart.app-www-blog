  </g>
  <text x="418" y="342" font-family="'Inter',Arial,sans-serif" font-size="8.5" fill="#94a3b8">Se désabonner des messages →</text>

  <!-- Lock icon bottom chat -->
  <rect x="398" y="430" width="194" height="24" rx="0" fill="#0b1420"/>
  <text x="495" y="446" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="8.5" fill="#4ade80" opacity="0.6">🔒 double opt-in requis</text>

  <!-- Phone home bar -->
  <rect x="455" y="460" width="80" height="4" rx="2" fill="#253350"/>

  <!-- ── WA LOGO entre phone et section droite ── -->
