  <circle cx="495" cy="540" r="28" fill="#25D366" opacity="0.08"/>
  <circle cx="495" cy="540" r="18" fill="#25D366" opacity="0.12"/>

  <!-- ── RIGHT SECTION : Contraintes + comparaison postcart ── -->

  <!-- Section header -->
  <text x="636" y="82" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="13" fill="#64748b" letter-spacing="1">BARRIÈRES D'ENTRÉE RÉELLES</text>

  <!-- Constraint block 1 : Compte Meta Business -->
  <g filter="url(#cardShadow)">
    <rect x="636" y="96" width="488" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <circle cx="668" cy="130" r="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="668" y="135" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="13" fill="#f59e0b">⏳</text>
  <text x="696" y="118" font-family="'Inter',Arial,sans-serif" font-weight="700" font-size="12" fill="#f1f5f9">Compte Meta Business vérifié</text>
  <text x="696" y="134" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#94a3b8">Validation 1 à 4 semaines · partenaire BSP obligatoire</text>
  <text x="696" y="149" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#94a3b8">Twilio, MessageBird, 360dialog · numéro dédié</text>

  <!-- Constraint block 2 : Templates approuvés -->
  <g filter="url(#cardShadow)">
    <rect x="636" y="178" width="488" height="68" rx="10" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1"/>
