<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#0d1f35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060e1a;stop-opacity:1" />
    </linearGradient>
    <!-- WhatsApp green gradient -->
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#25D366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128C7E;stop-opacity:1" />
    </linearGradient>
    <!-- Postcart violet gradient -->
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <!-- Card dark gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.97" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.97" />
    </linearGradient>
    <!-- Phone body gradient -->
    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1020;stop-opacity:1" />
    </linearGradient>
    <!-- WA chat bg gradient -->
    <linearGradient id="chatBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060e1a;stop-opacity:1" />
    </linearGradient>
    <!-- Red alert gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f87171;stop-opacity:1" />
    </linearGradient>
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowViolet">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.9" fill="#334155" opacity="0.28"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- WA green ambient glow — top-left -->
  <ellipse cx="140" cy="170" rx="200" ry="160" fill="#25D366" opacity="0.05"/>
  <!-- Postcart violet ambient glow — top-right -->
  <ellipse cx="1070" cy="200" rx="180" ry="150" fill="#6c63ff" opacity="0.07"/>

  <!-- Accent line top — split WA green left / postcart violet right -->
  <rect x="0" y="0" width="600" height="3" fill="url(#waGrad)"/>
  <rect x="600" y="0" width="600" height="3" fill="url(#pcGrad)"/>

  <!-- ── LEFT SECTION : titre + cartes stats WhatsApp ── -->

  <!-- Main title -->
  <text x="68" y="108" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="36" fill="#f8fafc" letter-spacing="-0.8">Relance panier</text>
  <text x="68" y="152" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="36" fill="#25D366" letter-spacing="-0.8" filter="url(#glowGreen)">WhatsApp</text>
  <text x="68" y="196" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="36" fill="#f8fafc" letter-spacing="-0.8">Shopify</text>

  <!-- Subtitle -->
  <text x="68" y="228" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="15" fill="#94a3b8">Le 98% d'ouverture qui cache une réalité plus complexe</text>

  <!-- Separator -->
  <rect x="68" y="246" width="56" height="3" rx="2" fill="url(#waGrad)"/>

  <!-- ── STAT CARD 1 : 98% ouverture (avec nuance) ── -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="268" width="252" height="108" rx="12" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <!-- left accent green -->
  <rect x="68" y="268" width="4" height="108" rx="2" fill="url(#waGrad)"/>
  <text x="88" y="296" font-family="'Inter',Arial,sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="0.6">TAUX D'OUVERTURE AFFICHÉ</text>
  <text x="88" y="338" font-family="'Inter',Arial,sans-serif" font-weight="900" font-size="44" fill="#25D366" filter="url(#glowGreen)">98%</text>
  <text x="88" y="358" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#64748b">messages perso entre particuliers</text>
  <text x="88" y="371" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#ef4444">≠ marketing sortant</text>

  <!-- ── STAT CARD 2 : opt-in réel France ── -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="392" width="252" height="108" rx="12" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <rect x="68" y="392" width="4" height="108" rx="2" fill="url(#redGrad)"/>
  <text x="88" y="420" font-family="'Inter',Arial,sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="0.6">OPT-IN WHATSAPP EN FRANCE</text>
  <text x="88" y="462" font-family="'Inter',Arial,sans-serif" font-weight="900" font-size="44" fill="#ef4444">&lt; 5%</text>
  <text x="88" y="482" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#64748b">de vos clients e-commerce</text>
  <text x="88" y="495" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#94a3b8">vs 60–80% opt-in email</text>

  <!-- ── STAT CARD 3 : coût API ── -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="516" width="252" height="82" rx="12" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <rect x="68" y="516" width="4" height="82" rx="2" fill="#f59e0b"/>
  <text x="88" y="542" font-family="'Inter',Arial,sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="0.6">COÛT API — CONVERSATION MARKETING</text>
  <text x="88" y="576" font-family="'Inter',Arial,sans-serif" font-weight="800" font-size="28" fill="#f59e0b">0,04–0,10 €</text>
  <text x="88" y="591" font-family="'Inter',Arial,sans-serif" font-size="11" fill="#64748b">+ setup BSP 100–500 € + abonnement mensuel</text>

  <!-- ── CENTRE : WhatsApp phone mockup ── -->

