  </g>

  <!-- Dynamic island -->
  <rect x="456" y="58" width="78" height="20" rx="10" fill="#060e1a"/>
  <circle cx="502" cy="68" r="5.5" fill="#0b1623"/>

  <!-- Phone screen -->
  <rect x="398" y="88" width="194" height="366" rx="6" fill="url(#chatBgGrad)"/>

  <!-- WA chat header -->
