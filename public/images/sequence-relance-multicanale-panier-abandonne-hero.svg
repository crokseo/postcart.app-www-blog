<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="smsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.2" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left side — Main headline block -->
  <text x="64" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="4">SÉQUENCE MULTICANALE · GUIDE D'IMPLÉMENTATION</text>

  <text x="64" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#f1f5f9" letter-spacing="-1">Email → SMS →</text>
  <text x="64" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#a855f7" letter-spacing="-1">Carte postale</text>
  <text x="64" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#94a3b8">Le workflow complet de relance</text>
  <text x="64" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#94a3b8">panier abandonné.</text>

  <!-- Key stat — hero number -->
  <rect x="64" y="300" width="310" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="64" y="300" width="5" height="90" rx="2" fill="#a855f7"/>
  <text x="88" y="330" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">vs séquence email seule (DMA 2025)</text>
  <text x="88" y="372" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#f1f5f9" filter="url(#softGlow)">+118%</text>
  <text x="240" y="372" font-family="Arial, sans-serif" font-size="13" fill="#a855f7">de taux</text>
  <text x="240" y="388" font-family="Arial, sans-serif" font-size="13" fill="#a855f7">de réponse</text>

  <!-- Second stat -->
  <rect x="64" y="408" width="145" height="72" rx="10" fill="#172554" stroke="#1d4ed8" stroke-width="1"/>
  <text x="137" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd">Récup. totale</text>
  <text x="137" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#3b82f6">9–15%</text>
  <text x="137" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#60a5fa">des paniers</text>

  <rect x="220" y="408" width="155" height="72" rx="10" fill="#052e16" stroke="#15803d" stroke-width="1"/>
  <text x="297" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#86efac">ROI rentable dès</text>
  <text x="297" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#22c55e">1/20</text>
  <text x="297" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4ade80">conversion / envois</text>

  <!-- ── Right side — Sequence timeline ── -->
  <!-- Timeline spine -->
  <line x1="490" y1="55" x2="1140" y2="55" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Step labels on spine -->
  <text x="490" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">J+1</text>
  <text x="645" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">J+3</text>
  <text x="800" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">J+5</text>
  <text x="970" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">J+10</text>

  <!-- === EMAIL BLOCK === -->
  <!-- Email 1 -->
  <rect x="448" y="62" width="170" height="170" rx="12" fill="#0f2a54" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="448" y="62" width="170" height="36" rx="12" fill="url(#emailGrad)" opacity="0.8"/>
  <rect x="448" y="86" width="170" height="12" fill="url(#emailGrad)" opacity="0.8"/>
  <!-- Email icon -->
  <rect x="460" y="70" width="20" height="14" rx="2" fill="none" stroke="#bfdbfe" stroke-width="1.2"/>
  <polyline points="460,70 470,79 480,70" fill="none" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="486" y="82" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dbeafe">Email 1 · J+1</text>
  <text x="460" y="118" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd">Rappel doux</text>
  <text x="460" y="136" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Sans réduction</text>
  <text x="460" y="154" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Visuel produit</text>
  <rect x="460" y="168" width="142" height="24" rx="6" fill="#1d4ed8" opacity="0.6"/>
  <text x="531" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dbeafe">45–50% ouverture</text>
  <text x="460" y="218" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">↓ 5% converti</text>

  <!-- Email 2 -->
  <rect x="600" y="62" width="170" height="170" rx="12" fill="#0f2a54" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>
  <rect x="600" y="62" width="170" height="36" rx="12" fill="url(#emailGrad)" opacity="0.65"/>
  <rect x="600" y="86" width="170" height="12" fill="url(#emailGrad)" opacity="0.65"/>
  <rect x="612" y="70" width="20" height="14" rx="2" fill="none" stroke="#bfdbfe" stroke-width="1.2"/>
  <polyline points="612,70 622,79 632,70" fill="none" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="638" y="82" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dbeafe">Email 2 · J+3</text>
  <text x="612" y="118" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd">Réassurance</text>
  <text x="612" y="136" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Avis clients</text>
  <text x="612" y="154" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Retours faciles</text>
  <rect x="612" y="168" width="142" height="24" rx="6" fill="#1d4ed8" opacity="0.5"/>
  <text x="683" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dbeafe">30–35% ouverture</text>
  <text x="612" y="218" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">↓ non-répondants</text>

  <!-- Email 3 + SMS -->
  <rect x="752" y="62" width="170" height="170" rx="12" fill="#0f2a54" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <rect x="752" y="62" width="170" height="36" rx="12" fill="url(#emailGrad)" opacity="0.5"/>
  <rect x="752" y="86" width="170" height="12" fill="url(#emailGrad)" opacity="0.5"/>
  <rect x="764" y="70" width="20" height="14" rx="2" fill="none" stroke="#bfdbfe" stroke-width="1.2"/>
  <polyline points="764,70 774,79 784,70" fill="none" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="790" y="82" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dbeafe">Email 3 · J+5</text>
  <text x="764" y="118" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd">Dernière chance</text>
  <text x="764" y="136" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Urgence légère</text>
  <text x="764" y="154" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Pas de réduction</text>
  <rect x="764" y="168" width="142" height="24" rx="6" fill="#1d4ed8" opacity="0.4"/>
  <text x="835" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dbeafe">~20% ouverture</text>
  <text x="764" y="218" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">↓ non-répondants</text>

  <!-- SMS block (parallel à email 3) -->
  <rect x="752" y="248" width="170" height="130" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="752" y="248" width="170" height="36" rx="12" fill="url(#smsGrad)" opacity="0.7"/>
  <rect x="752" y="272" width="170" height="12" fill="url(#smsGrad)" opacity="0.7"/>
  <!-- SMS bubble icon -->
  <rect x="764" y="256" width="18" height="12" rx="4" fill="none" stroke="#bbf7d0" stroke-width="1.2"/>
  <polygon points="766,268 764,274 770,268" fill="#bbf7d0"/>
  <text x="788" y="268" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dcfce7">SMS · J+5</text>
  <text x="764" y="304" font-family="Arial, sans-serif" font-size="11" fill="#86efac">Message court</text>
  <text x="764" y="322" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Opt-in requis</text>
  <rect x="764" y="336" width="142" height="24" rx="6" fill="#15803d" opacity="0.5"/>
  <text x="835" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dcfce7">30% ouverture · 1-2%</text>

  <!-- Connector email 3 → SMS -->
  <line x1="837" y1="232" x2="837" y2="248" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- === POSTCARD BLOCK === -->
  <rect x="924" y="62" width="216" height="316" rx="14" fill="#2d1a5e" stroke="#a855f7" stroke-width="2" filter="url(#softGlow)"/>
  <rect x="924" y="62" width="216" height="42" rx="14" fill="url(#postGrad)" opacity="0.85"/>
  <rect x="924" y="90" width="216" height="14" fill="url(#postGrad)" opacity="0.85"/>
  <!-- Postcard icon (simple) -->
  <rect x="936" y="70" width="22" height="16" rx="3" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
  <line x1="936" y1="78" x2="958" y2="78" stroke="#e9d5ff" stroke-width="1"/>
  <rect x="950" y="66" width="8" height="6" rx="1" fill="#e9d5ff" opacity="0.6"/>
  <text x="964" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f3e8ff">Carte postale · J+10</text>

  <text x="938" y="126" font-family="Arial, sans-serif" font-size="11" fill="#d8b4fe">Format physique</text>
  <text x="938" y="146" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Aucun opt-in requis</text>
  <text x="938" y="164" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">17 jours de dwell time</text>
  <text x="938" y="182" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Activation ≥ 60€ panier</text>

  <!-- Big metric in postcard block -->
  <rect x="938" y="198" width="186" height="58" rx="10" fill="#1a0a3a"/>
  <text x="1031" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c4b5fd">Taux d'ouverture</text>
  <text x="1031" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#a855f7" filter="url(#softGlow)">91%</text>

  <rect x="938" y="272" width="186" height="30" rx="8" fill="#6d28d9" opacity="0.5"/>
  <text x="1031" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f3e8ff">3–5% récupération</text>

  <!-- Connector from email/SMS column to postcard -->
  <line x1="922" y1="220" x2="924" y2="220" stroke="#a855f7" stroke-width="2"/>
  <polygon points="910,214 910,226 924,220" fill="#a855f7"/>
  <line x1="912" y1="220" x2="752" y2="313" stroke="#a855f7" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Cumulative rate bar at bottom of right panel -->
  <rect x="448" y="430" width="692" height="62" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="794" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Taux de récupération cumulatif · séquence complète</text>

  <!-- Bar segments -->
  <rect x="460" y="460" width="220" height="18" rx="4" fill="#1d4ed8" opacity="0.7"/>
  <text x="570" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dbeafe">Email : 5–8%</text>

  <rect x="688" y="460" width="120" height="18" rx="4" fill="#15803d" opacity="0.7"/>
  <text x="748" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dcfce7">SMS : +1–2%</text>

  <rect x="816" y="460" width="180" height="18" rx="4" fill="#6d28d9" opacity="0.7"/>
  <text x="906" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e9d5ff">Carte postale : +3–5%</text>

  <text x="1106" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">= 9–15%</text>

  <!-- Bottom separator -->
  <line x1="64" y1="518" x2="1136" y2="518" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo branding — bas gauche -->
  <text x="64" y="552" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7c3aed">postcart</text>
  <text x="166" y="552" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">.app</text>
  <text x="64" y="572" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">La séquence de relance multicanale pour Shopify</text>

  <!-- Right label -->
  <text x="1136" y="552" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Email · SMS · Carte postale · Workflow complet 2026</text>
  <text x="1136" y="572" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6d28d9">+118% taux de réponse vs email seul · DMA 2025</text>
</svg>
