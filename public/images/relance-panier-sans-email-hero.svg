<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Subtle grid -->
  <pattern id="grid2" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid2)"/>

  <!-- Right side — channel icons comparison visual -->
  <g transform="translate(720, 315)">
    <!-- Email channel (crossed out) -->
    <rect x="-80" y="-200" width="160" height="90" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="-165" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">Email</text>
    <text x="0" y="-145" text-anchor="middle" font-family="Arial" font-size="20">✉️</text>
    <text x="0" y="-120" text-anchor="middle" font-family="Arial" font-size="10" fill="#ef4444">39-50 % ouverture</text>
    <!-- Cross -->
    <line x1="-75" y1="-200" x2="75" y2="-110" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
    <line x1="75" y1="-200" x2="-75" y2="-110" stroke="#ef4444" stroke-width="2" opacity="0.6"/>

    <!-- SMS channel -->
    <rect x="-80" y="-90" width="160" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="-55" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">SMS</text>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="20">💬</text>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="10" fill="#f59e0b">Opt-in requis</text>

    <!-- Push channel -->
    <rect x="-80" y="20" width="160" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="55" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">Push notif.</text>
    <text x="0" y="75" text-anchor="middle" font-family="Arial" font-size="20">🔔</text>
    <text x="0" y="100" text-anchor="middle" font-family="Arial" font-size="10" fill="#f59e0b">1-5 % activation</text>

    <!-- Postcard channel (highlighted) -->
    <rect x="-90" y="130" width="180" height="95" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="0" y="168" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#10b981">Carte postale ✓</text>
    <text x="0" y="188" text-anchor="middle" font-family="Arial" font-size="22">📮</text>
    <text x="0" y="212" text-anchor="middle" font-family="Arial" font-size="10" fill="#6ee7b7">Aucun opt-in requis</text>

    <!-- Arrow pointing to postcard -->
    <polygon points="-120,175 -105,168 -105,182" fill="#10b981"/>
    <line x1="-165" y1="175" x2="-107" y2="175" stroke="#10b981" stroke-width="2"/>
    <text x="-180" y="170" text-anchor="end" font-family="Arial" font-size="10" fill="#10b981">SEUL CANAL</text>
    <text x="-180" y="182" text-anchor="end" font-family="Arial" font-size="10" fill="#10b981">SANS OPT-IN</text>
  </g>

  <!-- Left side — text -->
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" letter-spacing="3">RELANCE PANIER — ALTERNATIVES EMAIL</text>

  <text x="80" y="200" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ffffff" letter-spacing="-1">Relancer sans email :</text>
  <text x="80" y="250" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ffffff" letter-spacing="-1">les vraies alternatives</text>
  <text x="80" y="300" font-family="Georgia, serif" font-size="30" font-weight="normal" fill="#94a3b8">qui fonctionnent en 2026.</text>

  <!-- Stats -->
  <g transform="translate(80, 355)">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="80" y="24" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f59e0b">30-40%</text>
    <text x="80" y="46" text-anchor="middle" font-family="Arial" font-size="10" fill="#94a3b8">paniers sans email valide</text>

    <rect x="178" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="258" y="24" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#10b981">70%</text>
    <text x="258" y="46" text-anchor="middle" font-family="Arial" font-size="10" fill="#94a3b8">match email → adresse</text>

    <rect x="356" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="436" y="24" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#6c63ff">91%</text>
    <text x="436" y="46" text-anchor="middle" font-family="Arial" font-size="10" fill="#94a3b8">ouverture courrier postal</text>
  </g>

  <!-- Logo / brand -->
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6c63ff">postcart</text>
  <text x="165" y="570" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">.app</text>
  <text x="80" y="592" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Guide complet — relance panier par canaux alternatifs</text>
</svg>
