  <!-- Matrix container -->
  <rect x="480" y="48" width="680" height="546" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#dropShadow)"/>

  <!-- Matrix header -->
  <text x="820" y="88" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="3">MATRICE RFM — RELANCE PANIER</text>

