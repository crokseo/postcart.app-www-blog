<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <pattern id="maingrid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.25" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#maingrid)"/>

  <!-- Gold accent glow top right -->
  <ellipse cx="1060" cy="90" rx="260" ry="130" fill="#f59e0b" opacity="0.05"/>
  <!-- Blue accent glow bottom right -->
  <ellipse cx="1100" cy="540" rx="200" ry="100" fill="#3b82f6" opacity="0.05"/>

  <!-- ══════════════════════════════════════
       LEFT COLUMN — Title + stats
  ══════════════════════════════════════ -->

  <!-- Eyebrow pill -->
  <rect x="60" y="66" width="256" height="28" rx="14" fill="#fbbf24" opacity="0.10"/>
  <rect x="60" y="66" width="256" height="28" rx="14" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.30"/>
  <text x="188" y="85" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="2">SEGMENTATION RFM · RELANCE PANIER</text>

  <!-- Main title -->
  <text x="60" y="156" font-family="'Segoe UI', Georgia, serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">Méthode RFM</text>
  <text x="60" y="210" font-family="'Segoe UI', Georgia, serif" font-size="44" font-weight="800" fill="#fbbf24" letter-spacing="-1">appliquée</text>
  <text x="60" y="256" font-family="'Segoe UI', Georgia, serif" font-size="30" font-weight="400" fill="#94a3b8">à la relance panier Shopify.</text>

  <!-- Separator -->
  <line x1="60" y1="284" x2="280" y2="284" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>

  <!-- Stat 1 — Seuil 80€ -->
  <rect x="60" y="300" width="190" height="84" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#dropShadow)"/>
  <rect x="60" y="300" width="5" height="84" rx="2" fill="#fbbf24"/>
  <text x="88" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Seuil carte postale</text>
  <text x="88" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" fill="#fbbf24" filter="url(#softGlow)">80€</text>
  <text x="88" y="376" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">rentabilité à 3% conv.</text>

  <!-- Stat 2 — ×2.3 -->
  <rect x="264" y="300" width="150" height="84" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropShadow)"/>
  <rect x="264" y="300" width="5" height="84" rx="2" fill="#3b82f6"/>
  <text x="292" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Fidèles vs nouveaux</text>
  <text x="292" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" fill="#60a5fa" filter="url(#softGlow)">×2,3</text>
  <text x="292" y="376" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">taux conv. post-relance</text>

  <!-- Stat 3 — RFM 90 jours -->
  <rect x="60" y="398" width="354" height="54" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="88" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Profil idéal carte postale :</text>
  <text x="88" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Récence &lt;90j · Fréquence 2+ · LTV &gt;3× panier moyen</text>

  <!-- Subcopy -->
  <text x="60" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Pour les marchands qui ont déjà une séquence active</text>
  <text x="60" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">et veulent aller plus loin.</text>

  <!-- branding postcart.app -->
  <text x="60" y="590" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">postcart.app</text>
