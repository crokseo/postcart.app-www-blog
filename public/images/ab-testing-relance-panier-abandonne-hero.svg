<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowCard">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle dot pattern -->
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#ffffff" opacity="0.025"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative background circles -->
  <circle cx="1080" cy="120" r="200" fill="#3b82f6" opacity="0.04"/>
  <circle cx="150" cy="520" r="160" fill="#3b82f6" opacity="0.03"/>
  <circle cx="600" cy="600" r="120" fill="#1d4ed8" opacity="0.04"/>

  <!-- Vertical divider line (center) -->
  <line x1="600" y1="30" x2="600" y2="600" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="600" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3b82f6" letter-spacing="3">VS</text>

  <!-- ── HEADER ── -->
  <text x="80" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#3b82f6" letter-spacing="4">A/B TESTING · OPTIMISATION</text>
  <text x="80" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#ffffff" letter-spacing="-1">A/B test relance</text>
  <text x="80" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#ffffff" letter-spacing="-1">panier abandonné</text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Quoi tester, dans quel ordre, comment ne pas se tromper</text>

  <!-- Separator -->
  <rect x="80" y="220" width="56" height="3" rx="2" fill="url(#blueGrad)"/>

  <!-- ── STAT BADGES (top area) ── -->
  <!-- Badge 1 : 95% significativité -->
  <rect x="80" y="244" width="220" height="64" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadowCard)"/>
  <text x="100" y="266" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Significativité minimale</text>
  <text x="100" y="298" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#3b82f6" filter="url(#glow)">95 %</text>

  <!-- Badge 2 : +30% sur objet -->
  <rect x="316" y="244" width="236" height="64" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadowCard)"/>
  <text x="336" y="266" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Gain potentiel sur l'objet email</text>
  <text x="336" y="298" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#10b981" filter="url(#glow)">+30 %</text>

  <!-- Badge 3 : 2 semaines minimum -->
  <rect x="568" y="244" width="50" height="64" rx="10" fill="#1e293b" stroke="#1e3a5f" stroke-width="1"/>
  <!-- hidden spacer, real badge below -->

  <!-- ── LEFT COLUMN : VARIANTE A ── -->
  <rect x="62" y="326" width="500" height="256" rx="14" fill="#0f1f35" stroke="#3b82f6" stroke-width="2" filter="url(#shadowCard)"/>

  <!-- Variante A Header -->
  <rect x="62" y="326" width="500" height="46" rx="14" fill="url(#blueGradV)"/>
  <rect x="62" y="354" width="500" height="18" fill="#1d4ed8"/>
  <text x="312" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" letter-spacing="2">VARIANTE A</text>

  <!-- Fake email preview A -->
  <rect x="86" y="386" width="452" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="100" y="405" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Objet : "Vous avez oublié quelque chose…"</text>

  <!-- Bar chart A -->
  <text x="86" y="438" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Taux d'ouverture</text>
  <rect x="86" y="446" width="260" height="14" rx="4" fill="#1e293b"/>
  <rect x="86" y="446" width="156" height="14" rx="4" fill="#64748b" opacity="0.8"/>
  <text x="354" y="458" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">34 %</text>

  <text x="86" y="480" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Taux de conversion</text>
  <rect x="86" y="488" width="260" height="14" rx="4" fill="#1e293b"/>
  <rect x="86" y="488" width="88" height="14" rx="4" fill="#64748b" opacity="0.8"/>
  <text x="354" y="500" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">2,1 %</text>

  <text x="86" y="522" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Revenu par email</text>
  <rect x="86" y="530" width="260" height="14" rx="4" fill="#1e293b"/>
  <rect x="86" y="530" width="104" height="14" rx="4" fill="#64748b" opacity="0.7"/>
  <text x="354" y="542" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">1,18 €</text>

  <!-- Label résultat A -->
  <rect x="86" y="554" width="98" height="20" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="135" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Référence</text>

  <!-- ── RIGHT COLUMN : VARIANTE B ── -->
  <rect x="638" y="326" width="500" height="256" rx="14" fill="#0f1f35" stroke="#10b981" stroke-width="2" filter="url(#shadowCard)"/>

  <!-- Variante B Header -->
  <rect x="638" y="326" width="500" height="46" rx="14" fill="#064e3b"/>
  <rect x="638" y="354" width="500" height="18" fill="#065f46"/>
  <text x="888" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" letter-spacing="2">VARIANTE B</text>

  <!-- Fake email preview B -->
  <rect x="662" y="386" width="452" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="676" y="405" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Objet : "Votre panier expire dans 2h"</text>

  <!-- Bar chart B — meilleur sur ouverture mais test sur revenu final -->
  <text x="662" y="438" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Taux d'ouverture</text>
  <rect x="662" y="446" width="260" height="14" rx="4" fill="#1e293b"/>
  <rect x="662" y="446" width="204" height="14" rx="4" fill="url(#blueGrad)" opacity="0.9"/>
  <text x="930" y="458" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa">44 % (+29 %)</text>

  <text x="662" y="480" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Taux de conversion</text>
  <rect x="662" y="488" width="260" height="14" rx="4" fill="#1e293b"/>
  <rect x="662" y="488" width="110" height="14" rx="4" fill="url(#greenGrad)" opacity="0.9"/>
  <text x="930" y="500" font-family="Arial, sans-serif" font-size="11" fill="#34d399">2,6 % (+24 %)</text>

  <text x="662" y="522" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Revenu par email</text>
  <rect x="662" y="530" width="260" height="14" rx="4" fill="#1e293b"/>
  <rect x="662" y="530" width="148" height="14" rx="4" fill="url(#greenGrad)" opacity="0.9"/>
  <text x="930" y="542" font-family="Arial, sans-serif" font-size="11" fill="#34d399">1,68 € (+42 %)</text>

  <!-- Label résultat B -->
  <rect x="662" y="554" width="116" height="20" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="720" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#34d399">Gagnante ✓</text>

  <!-- ── BOTTOM STAT STRIP ── -->
  <rect x="62" y="590" width="310" height="26" rx="6" fill="#1e293b" stroke="#1e3a5f" stroke-width="1"/>
  <text x="80" y="607" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Durée minimale d'un test :</text>
  <text x="214" y="607" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3b82f6">2 semaines</text>

  <rect x="390" y="590" width="340" height="26" rx="6" fill="#1e293b" stroke="#1e3a5f" stroke-width="1"/>
  <text x="408" y="607" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Échantillon minimum par variante :</text>
  <text x="614" y="607" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3b82f6">200 emails</text>

  <!-- ── BRANDING BAS GAUCHE ── -->
  <g transform="translate(1020, 592)">
    <rect x="0" y="0" width="160" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="15" r="7" fill="url(#blueGrad)"/>
    <text x="16" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">P</text>
    <text x="34" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">postcart</text>
    <text x="94" y="20" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">.app</text>
  </g>
</svg>
